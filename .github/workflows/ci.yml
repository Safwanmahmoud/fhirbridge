name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package: [".", ".[all]"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "${{ matrix.package }}"
      - run: python -m pip install build mypy pytest pytest-asyncio ruff twine types-PyYAML
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: >-
          python -c "import fhiratwill;
          assert fhiratwill.__version__ == '0.2.0';
          assert fhiratwill.load_concepts().version == '1';
          assert callable(fhiratwill.validate);
          assert callable(fhiratwill.text2fhir);
          assert callable(fhiratwill.voice2fhir);
          assert callable(fhiratwill.deidentify)"
